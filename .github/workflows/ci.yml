name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so build-time code that reads these env vars doesn't crash — no real
      # secrets here, and DATABASE_URL is deliberately left unset so the DB-touching integration
      # test (lib/__tests__/reserve.integration.test.ts) self-skips instead of hitting production.
      JWT_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm run test
